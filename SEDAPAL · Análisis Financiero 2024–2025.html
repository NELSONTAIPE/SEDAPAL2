function bars(t,lb,a,b,fm){const m=Math.max(...a.map(Math.abs),...b.map(Math.abs))||1,W=340,g=W/lb.length,sh=v=>fm==F.s?(v/1000).toFixed(0)+'M':fm==F.p?(v*100).toFixed(1)+'%':v.toFixed(1);let s=`<svg viewBox="0 0 ${W} 185"><line x1="0" x2="${W}" y1="150" y2="150" stroke="var(--bd)"/>`;
lb.forEach((l,i)=>{[b[i],a[i]].forEach((v,j)=>{const h=Math.abs(v)/m*110,x=i*g+g*.12+j*g*.38,y=v>=0?150-h:150;s+=`<rect x="${x}" y="${y}" width="${g*.36}" height="${h}" rx="3" fill="${j?'var(--ac)':'var(--mut2)'}"><title>${l} ${j?2025:2024}: ${fm(v)}</title></rect><text x="${x+g*.18}" y="${v>=0?y-3:y+h+10}" text-anchor="middle" font-size="8.5" fill="var(--tx)">${sh(v)}</text>`});s+=`<text x="${i*g+g/2}" y="168" text-anchor="middle" font-size="9" fill="var(--mut)">${l}</text>`});
return`<div class="card ch"><h4>${t}</h4><div class="legend"><span>▮ 2024</span><span style="color:var(--ac)">▮ 2025</span></div>${s}</svg></div>`}
const stack=(t,it)=>{const tot=it.reduce((s,i)=>s+i[1],0)||1;return`<div class="card"><h4 style="margin:0">${t}</h4><div class="bar">${it.map(i=>`<i style="width:${i[1]/tot*100}%;background:${i[2]}" title="${i[0]}: ${F.s(i[1])}">${(i[1]/tot*100).toFixed(0)}%</i>`).join('')}</div><div class="legend">${it.map(i=>`<span style="color:${i[2]}">▮ ${i[0]}</span>`).join('')}</div></div>`};
const kpi=(t,v,s)=>`<div class="card kpi"><div class="sub">${t}</div><div class="big">${v}</div><div class="sub">${s}</div></div>`;
function dash(A,B){const g=(k,fm)=>`${fm(B[k])} en 2024`;return`<h2>Dashboard</h2><p class="lead">Se actualiza solo cuando cambias datos en la pestaña ✏️ Datos. Pasa el mouse/dedo sobre las barras para ver el valor.</p>
<div class="grid">${kpi('Ingresos 2025',F.s(A.v),g('v',F.s))}${kpi('Utilidad neta 2025',F.s(A.un),g('un',F.s))}${kpi('ROE',F.p(A.roe),g('roe',F.p))}${kpi('Liquidez general',F.x(A.liq),g('liq',F.x))}${kpi('Endeudamiento total',F.p(A.eto),g('eto',F.p))}${kpi('Ciclo de conversión de efectivo',F.d(A.cce),g('cce',F.d))}</div><br>
<div class="grid w">${bars('Resultados (S/ mil)',['Ingresos','U. bruta','U. operativa','U. neta'],[A.v,A.ub,A.uo,A.un],[B.v,B.ub,B.uo,B.un],F.s)}
${bars('Rentabilidad',['M. bruto','M. oper.','M. neto','ROA','ROE'],[A.mb,A.mo,A.mn,A.roa,A.roe],[B.mb,B.mo,B.mn,B.roa,B.roe],F.p)}
${bars('Liquidez (veces)',['General','Ácida','Defensiva'],[A.liq,A.aci,A.def],[B.liq,B.aci,B.def],F.x)}
${bars('Ciclo de efectivo (días)',['DIO','DSO','DPO','CCE'],[A.dio,A.dso,A.dpo,A.cce],[B.dio,B.dso,B.dpo,B.cce],F.d)}
${bars('Solvencia (veces)',['Respaldo','Apal. pat.','Cobertura int.'],[A.sol,A.apa,A.cob],[B.sol,B.apa,B.cob],F.x)}
${bars('Capital de trabajo (S/ mil)',['CTN','KTNO'],[A.ctn,A.ktno],[B.ctn,B.ktno],F.s)}
${stack('Estructura del activo 2025',[['Corriente',A.AC,'var(--ac2)'],['No corriente',A.ANC,'var(--ac)']])}${stack('¿Cómo se financia? 2025',[['Pas. corriente',A.PC,'#e8a30c'],['Pas. no corriente',A.PNC,'#dc3b3b'],['Patrimonio',A.PN,'#14a05a']])}</div>`}
function datos(A){const sec=s=>`<div class="card"><h3 style="margin:0 0 6px">${SEC[s]}</h3><div class="inp sub"><span></span><b>2025</b><b>2024</b></div>${R.filter(r=>r.s==s).map(r=>`<div class="inp"><span>${r.n}${r.g?' ⚠️':''}</span><input type="number" data-k="${r.k}" data-y="a" value="${r.a}"><input type="number" data-k="${r.k}" data-y="b" value="${r.b}"></div>`).join('')}</div>`;
return`<h2>Datos editables</h2><p class="lead">Cambia cualquier número y todas las pestañas se recalculan. “Restablecer Excel” vuelve a los datos originales.</p>
<div class="ctl card"><label><input type="checkbox" id="fx" ${fix?'checked':''}> Quitar duplicidad de subtotales (⚠️)</label><label>% ventas a crédito <input type="number" id="pc" value="${pcr*100}" style="width:70px"></label><label>Días del año <input type="number" id="dy" value="${DY}" style="width:70px"></label></div>
<div id="live"></div><div class="alert"><b>Notas sobre el Excel:</b><br>① El Excel suma las filas “subtotal” (⚠️) junto con sus componentes (ej. CxC y otras + CxC comerciales + otras), por eso su activo corriente es 1,565,644 y su pasivo corriente 1,828,878. Por defecto se respeta el Excel; activa la casilla para ver cifras sin doble conteo.<br>② En el Excel el Activo (14,622,602) no coincide con Pasivo + Patrimonio (15,505,686): se muestra abajo en vivo.<br>③ Cuatro ratios se recalculan con su fórmula coherente usando los montos del propio Excel, porque la hoja usaba bases ajenas: utilidad bruta 2024 (382,324 en vez de 385,771), DPO 2024 (costo de ventas en vez de ventas), rotaciones de activo fijo, activo corriente y capital de trabajo, y solvencia 2024 (activo total 14,355,696).</div>
<div class="grid w">${['AC','ANC','PC','PNC','PAT','ER'].map(sec).join('')}</div>`}
const liveHTML=A=>{const d=A.AT-A.PP;return`<div class="grid">${kpi('Total activos',F.s(A.AT),'2025')}${kpi('Pasivo + Patrimonio',F.s(A.PP),d?`<span class="dn">⚠ descuadre de ${n0(d)}</span>`:'<span class="up">✔ cuadra</span>')}${kpi('Utilidad neta',F.s(A.un),'2025')}${kpi('Liquidez general',F.x(A.liq),'2025')}${kpi('ROE',F.p(A.roe),'2025')}</div>`};
const HINT={AC:'Recursos que se vuelven dinero en menos de un año.',ANC:'Bienes de larga duración (plantas, redes, tuberías).',PC:'Deudas que vencen en menos de un año.',PNC:'Deudas que vencen en más de un año.',PAT:'Lo que pertenece a los dueños.',ER:'Ingresos y gastos del año.'};
function row(nm,a,b,ba,bb,bn,h,t){const av=a/ba,bv=b/bb,ah=(a-b)/Math.abs(b),df=a-b;return`<div class="${t?'t':''}"><details><summary><span>${nm}</span><span class="num">${n0(a)}</span><span class="num">${(av*100).toFixed(1)}%</span><span class="num">${n0(b)}</span><span class="num">${(bv*100).toFixed(1)}%</span><span class="num ${ah>=0?'up':'dn'}">${isFinite(ah)?(ah>=0?'▲ ':'▼ ')+(Math.abs(ah)*100).toFixed(1)+'%':'—'}</span></summary>
<div class="bd">📊 <b>Vertical:</b> de cada S/ 100 de ${bn}, S/ ${(av*100).toFixed(1)} corresponden a “${nm}” en 2025 (en 2024 eran S/ ${(bv*100).toFixed(1)}).<br>📈 <b>Horizontal:</b> ${nm} ${df>=0?'aumentó':'disminuyó'} ${isFinite(ah)?(Math.abs(ah)*100).toFixed(1)+'%':''} (${df>=0?'+':'−'}S/ ${n0(Math.abs(df))} mil frente a 2024).<br>💡 ${h}</div></details></div>`}
function hv(A,B){const o=[],sc=(s,tot,tn)=>{o.push(`<div class="hh" style="background:var(--mut)"><span>${SEC[s]}</span><span></span><span></span><span></span><span></span><span></span></div>`);R.filter(r=>r.s==s&&!(fix&&r.g)).forEach(r=>o.push(row(r.n,r.a,r.b,A.AT,B.AT,'activos totales',HINT[s])));if(tot)o.push(row(tn,A[tot],B[tot],A.AT,B.AT,'activos totales',HINT[s],1))};
['AC','ANC'].forEach((s,i)=>sc(s,s,'Total '+SEC[s].toLowerCase()));o.push(row('TOTAL ACTIVOS',A.AT,B.AT,A.AT,B.AT,'activos totales','Todo lo que posee la empresa.',1));
['PC','PNC'].forEach(s=>sc(s,s,'Total '+SEC[s].toLowerCase()));o.push(row('TOTAL PASIVOS',A.PT,B.PT,A.AT,B.AT,'activos totales','Todo lo que debe.',1));sc('PAT','PN','Total patrimonio');o.push(row('TOTAL PASIVO + PATRIMONIO',A.PP,B.PP,A.AT,B.AT,'activos totales','Debería ser igual al total de activos.',1));
const e=[['Ingresos de actividades ordinarias','v'],['Costo de ventas','cv'],['Ganancia bruta','ub',1],['Gastos de ventas y distribución','gv'],['Gastos de administración','ga'],['Otros ingresos operativos','oi'],['Otros gastos operativos','og'],['Ganancia operativa','uo',1],['Ingresos financieros','if_'],['Gastos financieros','gf'],['Diferencias de cambio neto','dc'],['Ganancia antes de impuestos','uai',1],['Gasto por impuesto','im'],['Ganancia neta del ejercicio','un',1]];
const er=e.map(x=>row(x[0],A[x[1]],B[x[1]],A.v,B.v,'ventas',x[2]?'Resultado parcial: lo que va quedando de cada sol vendido.':HINT.ER,x[2])).join('');
return`<h2>Análisis Horizontal y Vertical</h2><p class="lead">👆 Haz clic en cualquier fila para desplegar la explicación. <b>Vertical (A.V.)</b> = qué porción es del total. <b>Horizontal (A.H.)</b> = cuánto cambió frente a 2024.</p>
<h3>Estado de Situación Financiera <small class="sub">(base: total activos)</small></h3><div class="hv hvs"><div class="hh"><span>Cuenta</span><span class="num">2025</span><span class="num">A.V.</span><span class="num">2024</span><span class="num">A.V.</span><span class="num">A.H.</span></div>${o.join('')}</div>
<h3>Estado de Resultados <small class="sub">(base: ventas)</small></h3><div class="hv hvs"><div class="hh"><span>Cuenta</span><span class="num">2025</span><span class="num">A.V.</span><span class="num">2024</span><span class="num">A.V.</span><span class="num">A.H.</span></div>${er}</div>`}
function dup(A,B){return`<h2>Análisis DuPont</h2><p class="lead">Descompone el ROE en 3 piezas: <b>ROE = Margen × Rotación × Apalancamiento</b>.</p>
<div class="chain"><div>Margen neto<b>${F.p(A.mn)}</b></div><span class="op">×</span><div>Rotación<b>${A.rot.toFixed(4)}</b></div><span class="op">=</span><div>ROA<b>${F.p(A.rod)}</b></div><span class="op">×</span><div>Multiplicador<b>${A.mul.toFixed(3)}</b></div><span class="op">=</span><div>ROE<b>${F.p(A.roD)}</b></div></div>
${cards(['mn1','rot','rod','mul','roD'],A,B)}
<h3>🎛️ Simulador: ¿qué pasa si cambian las piezas?</h3><div class="card"><div class="sl"><span>Margen neto</span><input type="range" id="sm" min="0" max="0.6" step="0.005" value="${A.mn}"><b id="vm"></b></div><div class="sl"><span>Rotación</span><input type="range" id="sr" min="0" max="0.2" step="0.001" value="${A.rot}"><b id="vr"></b></div><div class="sl"><span>Multiplicador</span><input type="range" id="sk" min="1" max="5" step="0.01" value="${A.mul}"><b id="vk"></b></div><div class="simple" id="so"></div></div>`}
function sim(){const g=i=>+document.getElementById(i).value,m=g('sm'),r=g('sr'),k=g('sk');const e=i=>document.getElementById(i);e('vm').textContent=(m*100).toFixed(1)+'%';e('vr').textContent=r.toFixed(3);e('vk').textContent=k.toFixed(2);e('so').innerHTML=`🧒 Con estos valores el ROE sería <b>${(m*r*k*100).toFixed(2)}%</b> (ROA ${(m*r*100).toFixed(2)}%).`}
const page=(h,l,k,A,B)=>`<h2>${h}</h2><p class="lead">${l}</p>${cards(k,A,B)}`;
function render(){const[A,B]=M();document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',i==tab));
const h=[()=>dash(A,B),()=>datos(A),()=>hv(A,B),()=>dup(A,B),()=>page('Capital de trabajo','Es el “colchón” de dinero para operar día a día.',['ctn','ktno'],A,B),()=>page('Ratios de liquidez','¿Puede pagar sus deudas de corto plazo?',['liq','aci','def','ctn'],A,B),
()=>page('Ratios de gestión','¿Qué tan rápido cobra, paga y rota su almacén?',['rin','dio','rcc','dso','rcp','dpo','rat','raf','rac','rkt','cop','cce'],A,B),
()=>page('Ratios de solvencia','¿Cuánto debe y qué tan sólido es su respaldo?',['sol','elp','eto','apa','cob','dlp','afi'],A,B)+page('Ratios de rentabilidad','¿Cuánto gana por cada sol vendido o invertido?',['mb','mo','mn','roa','roe'],A,B)][tab]();
app.innerHTML=h;if(tab==1){document.getElementById('live').innerHTML=liveHTML(A)}if(tab==3){sim();['sm','sr','sk'].forEach(i=>document.getElementById(i).oninput=sim)}}
nav.innerHTML=T.map((t,i)=>`<button class="tab" data-i="${i}">${t}</button>`).join('');
nav.onclick=e=>{const i=e.target.dataset.i;if(i!=null){tab=+i;render();scrollTo(0,0)}};
app.addEventListener('change',e=>{const t=e.target;if(t.dataset.k){R.find(r=>r.k==t.dataset.k)[t.dataset.y]=+t.value||0}else if(t.id=='fx')fix=t.checked;else if(t.id=='pc')pcr=(+t.value||0)/100;else if(t.id=='dy')DY=+t.value||360;else return;
document.getElementById('live').innerHTML=liveHTML(M()[0])});
rs.onclick=()=>{init();render()};
th.onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
render();
</script></body></html>
